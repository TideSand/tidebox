[project]
name = "tidebox"
version = "0.1.0"
description = "Replay recorded agent runs in sandboxes without a model, and analyse the replays"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
# The replay driver's figures and analysis (workload/).
workload = ["matplotlib>=3.8", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tidebox = "tidebox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidebox"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
